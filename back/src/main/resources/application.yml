spring:
  datasource:
    url: jdbc:mysql://localhost:3306/vortex?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: vortex
    password: vortex
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
